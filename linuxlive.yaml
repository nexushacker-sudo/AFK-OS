# AFK OS, made with the linuxlive.com wizard on 2026-11-03.
# Build it in your own GitHub from https://github.com/Eric-Ness/linuxlive-distro (see README.md)
schema_version: 1
name: "AFK OS"
version: "0.2"
base: ubuntu
desktop: kde
apps:
  - firefox
  - libreoffice
  - vlc
  - thunderbird
  - steam
  - discord
  - vscode
  - audacity
  - gimp
  - inkscape
  - krita
  - blender
  - obs-studio
  - kdenlive
  - lutris
  - heroic
flathub:
  - org.kde.okular
  - com.usebottles.bottles
  - net.davidotek.pupgui2
  - org.dupot.easyflatpak
  - io.github.flattool.Warehouse
  - page.codeberg.JakobDev.jdFlatpakSnapshot
  - io.missioncenter.MissionCenter
  - org.bleachbit.BleachBit
  - dev.ibrahimcetin.reins
  - it.mijorus.whisper
  - org.freedesktop.Piper
  - top.akizip.akizip
packages:
  - ark
  - kdeconnect
  - samba
  - smbclient
  - cifs-utils
  - gvfs-backends
  - kio-extras
  - smb4k
  - avahi-daemon
  - avahi-utils
  - git
  - python3
  - docker.io
  - wireshark
  - wine
  - winetricks
  - curl
  - zstd
files:
  - src: files/maxence/maxence.py
    dest: /usr/lib/afk-maxence/maxence.py
  - src: files/maxence/index.html
    dest: /usr/lib/afk-maxence/index.html
  - src: files/maxence/afk-maxence.desktop
    dest: /usr/share/applications/afk-maxence.desktop
  - src: files/maxence/afk-maxence.desktop
    dest: /etc/skel/Desktop/Maxence.desktop
    mode: "0755"
scripts:
  build:
    - scripts/install-maxence.sh
branding:
  wallpaper: assets/wallpaper.png
  logo: assets/logo.png
  accent_color: "#1565c0"
  splash:
    script: assets/splash/splash.script
    images:
      - assets/splash/logo.png
      - assets/splash/progress-bg.png
      - assets/splash/progress-fill.png
settings:
  language: fr_FR
  keyboard: "fr"
  timezone: Europe/Paris
  dock:
    - firefox
    - libreoffice
    - vlc
    - thunderbird
    - steam
    - discord
    - vscode
    - org.kde.okular
    - com.usebottles.bottles
    - io.missioncenter.MissionCenter
firefox:
  homepage: "https://google.com"
