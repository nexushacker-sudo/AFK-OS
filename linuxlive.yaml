# AFK OS, made with the linuxlive.com wizard on 2026-11-02.
# Build it in your own GitHub from https://github.com/Eric-Ness/linuxlive-distro (see README.md)
schema_version: 1
name: "AFK OS"
version: "1.0"
base: ubuntu
desktop: kde
apps:
  - firefox
  - libreoffice
  - vlc
  - steam
  - heroic
  - discord
  - vscode
  - chromium
  - obs-studio
  - blender
  - audacity
  - flatseal
flathub:
  - com.usebottles.bottles
  - org.winehq.Wine
  - net.davidotek.pupgui2
  - com.protonvpn.www
  - org.dupot.easyflatpak
  - io.github.flattool.Warehouse
  - page.codeberg.JakobDev.jdFlatpakSnapshot
  - io.missioncenter.MissionCenter
  - org.bleachbit.BleachBit
  - dev.ibrahimcetin.reins
  - it.mijorus.whisper
  - org.freedesktop.Piper
branding:
  wallpaper: assets/wallpaper.png
  logo: assets/logo.png
  accent_color: "#1565c0"
  splash:
    script: assets/splash/splash.script
    images:
      - assets/splash/logo.png
      - assets/splash/progress-bg.png
      - assets/splash/progress-fill.png
settings:
  dock:
    - firefox
    - libreoffice
    - vlc
    - steam
    - discord
    - vscode
    - obs-studio
    - blender
    - audacity
    - org.winehq.Wine
    - com.protonvpn.www
    - io.missioncenter.MissionCenter
firefox:
  homepage: "https://google.com"
# Your own additions. Scripts and repos run as root; read them before you share the distro.
packages:
  - git
  - curl
  - wget
  - htop
  - unzip
  - p7zip-full
  - build-essential
  - python3
  - python3-pip
  - python3-venv
  - ffmpeg
  - gparted
  - timeshift
  - gufw
  - mesa-vulkan-drivers
  - mesa-utils
  - zram-tools
  - smartmontools
  - fwupd
