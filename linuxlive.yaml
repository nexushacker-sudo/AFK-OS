# AFK OS, made with the linuxlive.com wizard on 2026-11-03.
# Build it in your own GitHub from https://github.com/Eric-Ness/linuxlive-distro (see README.md)
schema_version: 1
name: "AFK OS"
version: "0.1"
base: ubuntu
desktop: kde
apps:
  - firefox
  - libreoffice
  - vlc
  - thunderbird
  - steam
  - heroic
  - lutris
  - discord
  - obs-studio
  - blender
  - gimp
  - krita
  - kdenlive
  - vscode
  - audacity
  - inkscape
flathub:
  - com.usebottles.bottles
  - net.davidotek.pupgui2
  - org.dupot.easyflatpak
  - io.github.flattool.Warehouse
  - page.codeberg.JakobDev.jdFlatpakSnapshot
  - io.missioncenter.MissionCenter
  - org.bleachbit.BleachBit
  - dev.ibrahimcetin.reins
  - it.mijorus.whisper
  - org.freedesktop.Piper
  - org.kde.okular
packages:
  - ark
  - kdialog
  - qdbus-qt6
  - kdeconnect
  - kio-extras
  - smb4k
  - samba
  - smbclient
  - cifs-utils
  - gvfs-backends
  - avahi-daemon
  - libnss-mdns
  - git
  - python3
  - docker.io
  - wireshark
  - wine
files:
  - src: files/themes/AFKNeon.colors
    dest: /usr/share/color-schemes/AFKNeon.colors
  - src: files/themes/AFKClassic.colors
    dest: /usr/share/color-schemes/AFKClassic.colors
  - src: files/themes/AFKMono.colors
    dest: /usr/share/color-schemes/AFKMono.colors
  - src: assets/wallpaper.png
    dest: /usr/share/wallpapers/AFKOS/Neon.png
  - src: assets/themes/classic.png
    dest: /usr/share/wallpapers/AFKOS/Classic.png
  - src: assets/themes/monochrome.png
    dest: /usr/share/wallpapers/AFKOS/Monochrome.png
  - src: files/afk-theme-picker
    dest: /usr/bin/afk-theme-picker
    mode: "0755"
  - src: files/afk-theme-picker.desktop
    dest: /usr/share/applications/afk-theme-picker.desktop
scripts:
  first-login:
    - scripts/first-login.sh
branding:
  wallpaper: assets/wallpaper.png
  logo: assets/logo.png
  accent_color: "#1688ff"
  splash:
    script: assets/splash/splash.script
    images:
      - assets/splash/logo.png
      - assets/splash/progress-bg.png
      - assets/splash/progress-fill.png
settings:
  language: fr_FR
  keyboard: "fr"
  timezone: Europe/Paris
  dock:
    - firefox
    - libreoffice
    - vlc
    - steam
    - discord
    - vscode
    - org.kde.okular
    - io.missioncenter.MissionCenter
firefox:
  homepage: "https://google.com"
