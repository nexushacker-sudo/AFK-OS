<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Maxence — AFK OS</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", sans-serif;
      background: #071225;
      color: #eef5ff;
      --blue: #46a5ff;
      --muted: #9eafc7;
      --glass: rgba(15, 34, 62, .78);
      --line: rgba(157, 195, 239, .16);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 10% 0%, rgba(19, 105, 204, .32), transparent 43%),
        radial-gradient(ellipse at 95% 100%, rgba(8, 77, 155, .27), transparent 45%),
        #071225;
    }
    button, textarea { font: inherit; }
    .shell { max-width: 930px; min-height: 100vh; margin: auto; padding: 28px 20px; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 14px; padding: 5px 2px 22px; }
    .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(145deg, #197de4, #102750); border: 1px solid rgba(146, 202, 255, .36); box-shadow: 0 8px 26px rgba(0, 105, 255, .24); font-size: 19px; font-weight: 800; letter-spacing: -1px; }
    h1 { margin: 0; font-size: 21px; letter-spacing: .2px; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .status { margin-left: auto; max-width: 45%; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; text-align: right; }
    .dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 99px; background: #e4a941; box-shadow: 0 0 10px currentColor; }
    .dot.ready { background: #4cd69b; }
    .dot.error, .dot.ollama-offline { background: #ff7777; }
    .panel { flex: 1; min-height: 360px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 24px; background: var(--glass); box-shadow: 0 24px 80px rgba(0, 0, 0, .23); backdrop-filter: blur(18px); }
    #messages { flex: 1; min-height: 300px; max-height: calc(100vh - 270px); overflow-y: auto; padding: 24px clamp(16px, 4vw, 36px); scroll-behavior: smooth; }
    .welcome { margin: 9vh auto 28px; max-width: 470px; text-align: center; }
    .welcome .mark { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 21px; font-size: 23px; }
    .welcome h2 { margin: 0 0 9px; font-size: 25px; }
    .welcome p { margin: 0; color: var(--muted); line-height: 1.6; }
    .message { width: fit-content; max-width: min(83%, 650px); margin: 13px 0; padding: 12px 15px; border: 1px solid var(--line); border-radius: 17px; background: rgba(255,255,255,.045); line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.user { margin-left: auto; background: linear-gradient(135deg, rgba(24,111,214,.34), rgba(24,111,214,.17)); border-color: rgba(83,166,255,.25); }
    .message.error { border-color: rgba(255,119,119,.35); color: #ffc0c0; }
    .composer { padding: 15px; border-top: 1px solid var(--line); background: rgba(4, 16, 34, .36); }
    .entry { display: flex; align-items: flex-end; gap: 12px; padding: 9px 10px 9px 15px; border: 1px solid rgba(144, 187, 237, .23); border-radius: 18px; background: rgba(7, 19, 38, .72); transition: border-color .2s, box-shadow .2s; }
    .entry:focus-within { border-color: rgba(70,165,255,.65); box-shadow: 0 0 0 3px rgba(70,165,255,.1); }
    textarea { flex: 1; min-height: 27px; max-height: 140px; resize: vertical; border: 0; outline: 0; background: transparent; color: #f3f7ff; line-height: 1.5; }
    textarea::placeholder { color: #7e91ad; }
    .send { width: 42px; height: 42px; flex: 0 0 42px; border: 0; border-radius: 13px; background: linear-gradient(145deg, #55b3ff, #2674e2); color: white; font-size: 19px; cursor: pointer; transition: transform .16s, opacity .16s; }
    .send:hover:not(:disabled) { transform: translateY(-2px); }
    .send:disabled { opacity: .48; cursor: wait; }
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 5px 0; color: #8295af; font-size: 11px; }
    .foot button, .retry { padding: 5px 8px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: #a9bad0; cursor: pointer; }
    .foot button:hover, .retry:hover { border-color: var(--line); color: white; }
    .retry { display: none; padding: 3px 7px; color: #d3e6ff; }
    .retry.show { display: inline-block; }
    .privacy { margin: 12px 5px 0; color: #8295af; font-size: 11px; text-align: center; }
    @media (max-width: 600px) {
      .shell { padding: 15px 11px; }
      header { gap: 10px; padding-bottom: 15px; }
      .mark { width: 42px; height: 42px; border-radius: 14px; }
      h1 { font-size: 18px; }
      .subtitle { font-size: 11px; }
      .status { max-width: 38%; font-size: 10px; }
      .panel { border-radius: 19px; }
      #messages { max-height: calc(100vh - 245px); padding: 17px 13px; }
      .message { max-width: 92%; }
      .foot { font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="mark" aria-hidden="true">M</div>
      <div>
        <h1>Maxence</h1>
        <div class="subtitle">Votre assistant local · AFK OS</div>
      </div>
      <div class="status" aria-live="polite">
        <span id="dot" class="dot"></span>
        <span id="statusText">Vérification d'Ollama…</span>
        <button id="retry" class="retry" type="button">Réessayer</button>
      </div>
    </header>
    <section class="panel" aria-label="Conversation avec Maxence">
      <div id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div>
      <form id="form" class="composer">
        <div class="entry">
          <textarea id="input" rows="1" maxlength="4000" placeholder="Posez une question à Maxence…" aria-label="Votre message"></textarea>
          <button id="send" class="send" type="submit" aria-label="Envoyer" title="Envoyer">↑</button>
        </div>
        <div class="foot">
          <span>Entrée pour envoyer · Maj + Entrée pour une nouvelle ligne</span>
          <button id="clear" type="button">Effacer la conversation</button>
        </div>
      </form>
    </section>
    <p class="privacy">Vos messages restent dans ce navigateur et sont envoyés uniquement à Ollama sur cet ordinateur.</p>
  </main>
  <script>
    const messagesEl = document.getElementById("messages");
    const statusText = document.getElementById("statusText");
    const dot = document.getElementById("dot");
    const retryButton = document.getElementById("retry");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");
    let history = [];
    let modelReady = false;
    let sending = false;
    try {
      const saved = JSON.parse(localStorage.getItem("afk-maxence-history") || "[]");
      if (Array.isArray(saved)) history = saved.filter(item =>
        item && ["user", "assistant"].includes(item.role) &&
        typeof item.content === "string").slice(-40);
    } catch (error) {
      history = [];
    }

    function showWelcome() {
      const welcome = document.createElement("div");
      welcome.className = "welcome";
      const mark = document.createElement("div");
      mark.className = "mark";
      mark.textContent = "M";
      const title = document.createElement("h2");
      title.textContent = "Bonjour, moi c'est Maxence.";
      const text = document.createElement("p");
      text.textContent = "Je peux vous aider à découvrir AFK OS, KDE et Linux, ou répondre à vos questions. Je fonctionne localement avec Ollama.";
      welcome.append(mark, title, text);
      messagesEl.append(welcome);
    }

    function renderMessage(message) {
      const bubble = document.createElement("div");
      bubble.className = `message ${message.role}`;
      bubble.textContent = message.content;
      messagesEl.append(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderHistory() {
      messagesEl.replaceChildren();
      if (history.length === 0) showWelcome();
      history.forEach(renderMessage);
    }

    function saveHistory() {
      try {
        localStorage.setItem("afk-maxence-history", JSON.stringify(history.slice(-40)));
      } catch (error) {
        statusText.textContent = "Historique non sauvegardé par le navigateur";
      }
    }

    async function refreshStatus() {
      try {
        const response = await fetch("/api/status", {cache: "no-store"});
        const status = await response.json();
        dot.className = `dot ${status.state || "error"}`;
        statusText.textContent = status.status || "État inconnu";
        retryButton.classList.toggle("show", ["error", "ollama-offline"].includes(status.state));
        modelReady = status.state === "ready";
        if (status.state === "downloading" && status.total > 0) {
          const percent = Math.floor(status.completed * 100 / status.total);
          statusText.textContent = `${status.status} · ${percent} %`;
        }
        sendButton.disabled = !modelReady || sending;
      } catch (error) {
        dot.className = "dot error";
        statusText.textContent = "Interface locale indisponible";
        retryButton.classList.add("show");
        sendButton.disabled = true;
      }
    }

    async function sendMessage(event) {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || !modelReady || sending) return;
      sending = true;
      history.push({role: "user", content: text});
      renderHistory();
      saveHistory();
      input.value = "";
      sendButton.disabled = true;
      const waiting = {role: "assistant", content: "Maxence réfléchit…"};
      renderMessage(waiting);
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({messages: requestHistory()})
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "La réponse a échoué.");
        history.push({role: "assistant", content: result.answer});
        saveHistory();
      } catch (error) {
        history.push({role: "assistant", content: `Erreur : ${error.message}`});
      }
      sending = false;
      renderHistory();
      await refreshStatus();
      input.focus();
    }

    function requestHistory() {
      const selected = [];
      let total = 0;
      for (const message of history.slice(-12).reverse()) {
        if (total + message.content.length > 12000) break;
        selected.unshift(message);
        total += message.content.length;
      }
      return selected;
    }

    document.getElementById("form").addEventListener("submit", sendMessage);
    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        document.getElementById("form").requestSubmit();
      }
    });
    document.getElementById("clear").addEventListener("click", () => {
      history = [];
      saveHistory();
      renderHistory();
      input.focus();
    });
    retryButton.addEventListener("click", async () => {
      retryButton.disabled = true;
      try {
        await fetch("/api/model/retry", {method: "POST"});
      } catch (error) {
        statusText.textContent = `Erreur : ${error.message}`;
      } finally {
        retryButton.disabled = false;
        await refreshStatus();
      }
    });
    renderHistory();
    refreshStatus();
    setInterval(refreshStatus, 4000);
  </script>
</body>
</html>
